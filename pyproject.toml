[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "rddsketch"
dynamic = ["version"]
description = "Rust-powered DDSketch for Python"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/f4hy/rddsketch"
Repository = "https://github.com/f4hy/rddsketch"
Issues = "https://github.com/f4hy/rddsketch/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-benchmark",
    "ddsketch",
    "ruff==0.15.21",
]

[tool.maturin]
module-name = "rddsketch._rddsketch"
python-source = "python"

[tool.ruff]
line-length = 100
