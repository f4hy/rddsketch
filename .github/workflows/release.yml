name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Set crate version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python3 -c "
          import os, re, pathlib
          version = os.environ['VERSION'].removeprefix('v')
          path = pathlib.Path('Cargo.toml')
          text = re.sub(r'(?m)^version = \".*\"', f'version = \"{version}\"', path.read_text(), count=1)
          path.write_text(text)
          "
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
      - name: Set crate version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python3 -c "
          import os, re, pathlib
          version = os.environ['VERSION'].removeprefix('v')
          path = pathlib.Path('Cargo.toml')
          text = re.sub(r'(?m)^version = \".*\"', f'version = \"{version}\"', path.read_text(), count=1)
          path.write_text(text)
          "
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.target }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Set crate version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python3 -c "
          import os, re, pathlib
          version = os.environ['VERSION'].removeprefix('v')
          path = pathlib.Path('Cargo.toml')
          text = re.sub(r'(?m)^version = \".*\"', f'version = \"{version}\"', path.read_text(), count=1)
          path.write_text(text)
          "
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set crate version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python3 -c "
          import os, re, pathlib
          version = os.environ['VERSION'].removeprefix('v')
          path = pathlib.Path('Cargo.toml')
          text = re.sub(r'(?m)^version = \".*\"', f'version = \"{version}\"', path.read_text(), count=1)
          path.write_text(text)
          "
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # Manual runs (workflow_dispatch) publish to TestPyPI as a dry run.
  # Requires a "testpypi" trusted publisher configured on the TestPyPI
  # project settings for this repo/workflow before it will work.
  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: [linux, windows, macos, sdist]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # Tag pushes (v*) publish to real PyPI. Requires a "pypi" trusted
  # publisher configured on the PyPI project settings for this
  # repo/workflow before it will work.
  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
